description = "Telegram-бот, решающий задачи по стереометрии: фильтр задач и LLM-решатель"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "requests",
    "beautifulsoup4",
    "lxml",
    "certifi",
    "pandas",
    "scikit-learn",
    "pymorphy3",
    "pymorphy3-dicts-ru",
    "snowballstemmer",
    "huggingface-hub",
    "argostranslate",
    "pymupdf",
    "torch",
    "transformers",
]
